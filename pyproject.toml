[project]
name = "cellenium"
version = "0.2.1"
description = "Playwright browser automation with a Google Sheets Page Object Model and CrewAI vision analysis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "crewai>=1.15.23",
    "fastapi>=0.142.2",
    "gspread>=6.2.1",
    "importlib-metadata>=8.0.0",
    "logfire>=5.1.1",
    "oauth2client>=4.1.3",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]

[project.scripts]
cellenium = "cellenium.cli:main"

[project.urls]
Homepage = "https://github.com/MedviJenka/cellenium-playwright"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cellenium"]

# Ship the Claude Code commands and skills inside the package; `cellenium claude` installs them.
[tool.hatch.build.targets.wheel.force-include]
".claude/commands/cellenium" = "cellenium/claude/commands/cellenium"
".claude/skills/cellenium" = "cellenium/claude/skills/cellenium"

[tool.pytest.ini_options]
pythonpath = ["src"]
