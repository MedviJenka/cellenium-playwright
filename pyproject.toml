[project]
name = "cellenium"
version = "0.3.5"
description = "Playwright browser automation with a Google Sheets Page Object Model and CrewAI vision analysis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "crewai",
    "fastapi",
    "gspread",
    "importlib-metadata",
    "logfire",
    "oauth2client",
    "pillow",
    "playwright",
    "pydantic-settings",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]

[project.scripts]
cellenium = "cellenium.cli:main"

[project.urls]
Homepage = "https://github.com/MedviJenka/cellenium-playwright"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cellenium"]

# Ship the Claude Code commands and skills inside the package; `cellenium claude` installs them.
[tool.hatch.build.targets.wheel.force-include]
".claude/commands/cellenium" = "cellenium/claude/commands/cellenium"
".claude/skills/cellenium" = "cellenium/claude/skills/cellenium"

[tool.pytest.ini_options]
pythonpath = ["src"]
