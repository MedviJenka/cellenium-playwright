name: cellenium-playwright package

on:
  push:
    branches: [ "main", 'integration', 'feature/*', 'fix/*', 'hotfix/*' ]
  pull_request:
    branches: [ "main", 'integration', 'feature/*', 'fix/*', 'hotfix/*' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install Chromium
        run: uv run --frozen playwright install --with-deps chromium

      - name: Lint
        run: |
          uvx --from flake8==7.4.1 flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
          uvx --from flake8==7.4.1 flake8 src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test
        run: xvfb-run --auto-servernum uv run --frozen pytest tests -v -n auto --dist loadscope
